<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çınar AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    background: #1e293b;
    padding: 18px;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    border-bottom: 1px solid #334155;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 15px;
    line-height: 1.4;
    word-wrap: break-word;
}

.user {
    background: #2563eb;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.ai {
    background: #334155;
    margin-right: auto;
    border-bottom-left-radius: 4px;
}

#inputArea {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #1e293b;
    border-top: 1px solid #334155;
}

#input {
    flex: 1;
    padding: 13px;
    border: none;
    outline: none;
    border-radius: 12px;
    font-size: 16px;
    background: #0f172a;
    color: white;
}

button {
    border: none;
    border-radius: 12px;
    padding: 0 17px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<header>🌳 Çınar AI</header>

<div id="chat">
    <div class="message ai">
        Merhaba! Ben Çınar AI. 😊<br>
        Bana bir şey sorabilirsin.
    </div>
</div>

<div id="inputArea">
    <input id="input" type="text" placeholder="Çınar AI'ye bir şey yaz..." autocomplete="off">
    <button onclick="sendMessage()">Gönder</button>
</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");

/* Kullanıcının yazdığı cümleyi küçük harfe çevirir,
   noktalama işaretlerini temizler ve Türkçe karakterleri korur. */
function temizle(yazi) {
    return yazi
        .toLocaleLowerCase("tr-TR")
        .replace(/[.,!?;:()[\]{}'"`]/g, "")
        .replace(/\s+/g, " ")
        .trim();
}

/* Küçük yazım hatalarını düzeltmeye yardımcı olur. */
function yazimHatasiDuzelt(metin) {

    const kelimeDuzeltmeleri = {
        "meraba": "merhaba",
        "mrb": "merhaba",
        "slm": "selam",
        "selamm": "selam",
        "naber": "ne haber",
        "nasilsin": "nasılsın",
        "nasılsın": "nasılsın",
        "tesekkur": "teşekkür",
        "tesekkurler": "teşekkürler",
        "tşk": "teşekkür",
        "sagol": "sağ ol",
        "saol": "sağ ol",
        "evettt": "evet",
        "hayirr": "hayır",
        "nedenki": "neden ki",
        "napıyosun": "ne yapıyorsun",
        "napıyorsun": "ne yapıyorsun",
        "napiyosun": "ne yapıyorsun",
        "saatkac": "saat kaç",
        "saatkac": "saat kaç",
        "saat": "saat"
    };

    let kelimeler = metin.split(" ");

    kelimeler = kelimeler.map(kelime => {
        return kelimeDuzeltmeleri[kelime] || kelime;
    });

    return kelimeler.join(" ");
}

/* Mesajı ekrana ekler. */
function mesajEkle(mesaj, tip) {

    const div = document.createElement("div");

    div.className = "message " + tip;

    div.innerHTML = mesaj;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

/* Saat sorularını yakalar. */
function saatSorusu(metin) {

    const saatKelimeleri = [
        "saat kaç",
        "saat kact",
        "saat kac",
        "şu an saat kaç",
        "su an saat kac",
        "şuan saat kaç",
        "suan saat kac",
        "şimdi saat kaç",
        "simdi saat kac",
        "saat kaç oldu",
        "saat kac oldu",
        "şu an saat kaç oldu",
        "su an saat kac oldu"
    ];

    return saatKelimeleri.some(soru => metin.includes(soru));
}

/* Saat bilgisini verir. */
function gercekSaatiVer() {

    const simdi = new Date();

    const saat = simdi.toLocaleTimeString("tr-TR", {
        hour: "2-digit",
        minute: "2-digit"
    });

    return "🕐 Şu an saat <b>" + saat + "</b>.";
}

/* Basit yazım hatası kontrolü. */
function yazimHatasiCevabi(orijinal, duzeltilmis) {

    if (orijinal !== duzeltilmis) {

        return {
            mesaj:
            "Sanırım <b>\"" +
            duzeltilmis +
            "\"</b> demek istedin. 😊"
        };
    }

    return null;
}

/* Çınar AI'nin cevap sistemi. */
function cevapVer(mesaj) {

    const orijinal = temizle(mesaj);

    const metin = yazimHatasiDuzelt(orijinal);

    /* SAAT */
    if (saatSorusu(metin)) {
        return gercekSaatiVer();
    }

    /* MERHABA */
    if (
        metin === "merhaba" ||
        metin === "selam" ||
        metin.includes("merhaba çınar ai") ||
        metin.includes("selam çınar ai")
    ) {
        return "Merhaba! 👋 Ben Çınar AI. Nasılsın?";
    }

    /* NASILSIN */
    if (
        metin.includes("nasılsın") ||
        metin.includes("nasilsin")
    ) {
        return "İyiyim! 😄 Seninle konuşmaya hazırım.";
    }

    /* SEN KİMSİN */
    if (
        metin.includes("sen kimsin") ||
        metin.includes("kimsin")
    ) {
        return "Ben Çınar AI! 🌳 Senin için hazırlanmış bir yapay zekâ sohbet asistanıyım.";
    }

    /* ADIN NE */
    if (
        metin.includes("adın ne") ||
        metin.includes("adin ne") ||
        metin.includes("ismin ne")
    ) {
        return "Benim adım Çınar AI. 🌳";
    }

    /* KİM YAPTI */
    if (
        metin.includes("seni kim yaptı") ||
        metin.includes("seni kim yapti") ||
        metin.includes("kim yaptın") ||
        metin.includes("kim yaptin")
    ) {
        return "Beni Çınar yaptı. 🌳🤖";
    }

    /* TEŞEKKÜR */
    if (
        metin.includes("teşekkür") ||
        metin.includes("tesekkur") ||
        metin.includes("sağ ol") ||
        metin.includes("sag ol")
    ) {
        return "Rica ederim! 😊";
    }

    /* NASIL YARDIM */
    if (
        metin.includes("ne yapabilirsin") ||
        metin.includes("neler yapabilirsin")
    ) {
        return "Sorularını cevaplayabilir, sohbet edebilir ve bazı yazım hatalarını anlayabilirim. 😊";
    }

    /* ŞAKA */
    if (
        metin.includes("şaka yap") ||
        metin.includes("saka yap")
    ) {
        return "Bilgisayar neden doktora gitmiş? Çünkü virüs kapmış! 😂";
    }

    /* HAVA DURUMU */
    if (
        metin.includes("hava nasıl") ||
        metin.includes("hava nasil")
    ) {
        return "Hava durumunu öğrenmek için konum bilgisine ve hava durumu verilerine erişmem gerekir. 🌤️";
    }

    /* GOOGLE */
    if (metin.includes("google")) {
        return "Google hakkında da konuşabiliriz. 🔎";
    }

    /* YAZIM HATASI VARSA */
    const duzeltme = yazimHatasiCevabi(orijinal, metin);

    if (duzeltme) {
        return duzeltme.mesaj;
    }

    /* ANLAŞILMAYAN MESAJ */
    return "Bunu tam anlayamadım. 🤔 Biraz farklı şekilde yazmayı deneyebilir misin?";
}

/* Mesaj gönderme */
function sendMessage() {

    const mesaj = input.value.trim();

    if (mesaj === "") return;

    mesajEkle(mesaj, "user");

    input.value = "";

    setTimeout(() => {

        const cevap = cevapVer(mesaj);

        mesajEkle(cevap, "ai");

    }, 300);
}

/* Enter ile gönder */
input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
