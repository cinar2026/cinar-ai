<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çınar AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: #1e293b;
    padding: 18px;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    border-bottom: 1px solid #334155;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 15px;
    line-height: 1.5;
    word-wrap: break-word;
}

.user {
    background: #2563eb;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.ai {
    background: #334155;
    margin-right: auto;
    border-bottom-left-radius: 4px;
}

#inputArea {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #1e293b;
    border-top: 1px solid #334155;
}

#input {
    flex: 1;
    padding: 13px;
    border: none;
    outline: none;
    border-radius: 12px;
    font-size: 16px;
    background: #0f172a;
    color: white;
}

button {
    border: none;
    border-radius: 12px;
    padding: 0 17px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<header>🌳 Çınar AI</header>

<div id="chat">
    <div class="message ai">
        Merhaba! 👋 Ben Çınar AI.<br>
        Bana istediğin şeyi yazabilirsin. 😊
    </div>
</div>

<div id="inputArea">
    <input
        id="input"
        type="text"
        placeholder="Çınar AI'ye bir şey yaz..."
        autocomplete="off"
    >
    <button onclick="sendMessage()">Gönder</button>
</div>

<script>

/* -----------------------------
   YAZIYI NORMALLEŞTİRME
----------------------------- */

function normalizeText(text) {

    return text
        .toLocaleLowerCase("tr-TR")
        .replace(/[.,!?;:()[\]{}'"`]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* -----------------------------
   SIK YAPILAN YAZIM HATALARI
----------------------------- */

const corrections = {

    "meraba": "merhaba",
    "merhba": "merhaba",
    "merhbaa": "merhaba",
    "mrb": "merhaba",

    "slm": "selam",
    "selamm": "selam",
    "selaam": "selam",

    "nasilsin": "nasılsın",
    "nasılsınnn": "nasılsın",
    "nasılsıın": "nasılsın",
    "nasılsn": "nasılsın",
    "nasılsı": "nasılsın",

    "naber": "ne haber",
    "naberr": "ne haber",
    "nehaber": "ne haber",

    "tesekkur": "teşekkür",
    "tesekkurler": "teşekkürler",
    "tesekkurler": "teşekkürler",
    "tşk": "teşekkür",
    "tsk": "teşekkür",

    "sagol": "sağ ol",
    "saol": "sağ ol",
    "sagolll": "sağ ol",

    "evettt": "evet",
    "evetttt": "evet",

    "hayirr": "hayır",
    "hayırır": "hayır",

    "saatkac": "saat kaç",
    "saatkac": "saat kaç",
    "saatkaç": "saat kaç",
    "saat kac": "saat kaç",
    "saat kaç": "saat kaç",

    "simdi": "şimdi",
    "suanda": "şu anda",
    "suan": "şu an",

    "napiyosun": "ne yapıyorsun",
    "napıyosun": "ne yapıyorsun",
    "napiosun": "ne yapıyorsun",
    "neapiyosun": "ne yapıyorsun",

    "adinne": "adın ne",
    "adınne": "adın ne",
    "isminne": "ismin ne",

    "kimsin": "kimsin",

    "yapabilirmisin": "yapabilir misin",
    "yapabilirmisin": "yapabilir misin",
    "edermisin": "eder misin",

    "nedenki": "neden ki",
    "nasılyani": "nasıl yani",

    "tamammm": "tamam",
    "tamammm": "tamam",

    "olurrr": "olur",
    "olmazzz": "olmaz",

    "cok": "çok",
    "cokkk": "çok",

    "cinar": "çınar",
    "çınarr": "çınar",

    "yazarmisin": "yazar mısın",
    "söylermisin": "söyler misin",
    "soylermisin": "söyler misin"
};


/* -----------------------------
   TEK KELİMELİK HATALARI DÜZELT
----------------------------- */

function correctWords(text) {

    let words = text.split(" ");

    words = words.map(word => {

        if (corrections[word]) {
            return corrections[word];
        }

        return word;
    });

    return words.join(" ");
}


/* -----------------------------
   FAZLA HARFLERİ YAKALA
   ÖRNEK:
   merhabaaa → merhaba
   selammmm → selam
----------------------------- */

function reduceRepeatedLetters(word) {

    return word.replace(/(.)\1{2,}/g, "$1$1");
}


/* -----------------------------
   GENEL DÜZELTME
----------------------------- */

function fixText(text) {

    let result = normalizeText(text);

    result = result
        .split(" ")
        .map(word => reduceRepeatedLetters(word))
        .join(" ");

    result = correctWords(result);

    return result;
}


/* -----------------------------
   SAAT KONTROLÜ
----------------------------- */

function isTimeQuestion(text) {

    const patterns = [

        "saat kaç",
        "saat kac",
        "saatkac",
        "saat kaç oldu",
        "saat kac oldu",

        "şu an saat kaç",
        "su an saat kac",

        "şuan saat kaç",
        "suan saat kac",

        "şimdi saat kaç",
        "simdi saat kac",

        "şu an saat kaç oldu",
        "su an saat kac oldu",

        "şuan saat kaç oldu",
        "suan saat kac oldu"
    ];

    return patterns.some(pattern => text.includes(pattern));
}


/* -----------------------------
   GERÇEK CİHAZ SAATİ
----------------------------- */

function getCurrentTime() {

    const now = new Date();

    const time = now.toLocaleTimeString("tr-TR", {
        hour: "2-digit",
        minute: "2-digit"
    });

    return "🕐 Şu an saat <b>" + time + "</b>.";
}


/* -----------------------------
   ÇINAR AI CEVAPLARI
----------------------------- */

function getAnswer(originalMessage) {

    const text = fixText(originalMessage);


    /* SAAT */

    if (isTimeQuestion(text)) {
        return getCurrentTime();
    }


    /* MERHABA */

    if (
        text === "merhaba" ||
        text === "selam" ||
        text.includes("merhaba çınar ai") ||
        text.includes("selam çınar ai")
    ) {

        return "Merhaba! 👋 Ben Çınar AI. Nasılsın?";
    }


    /* NASILSIN */

    if (
        text.includes("nasılsın") ||
        text.includes("nasilsin")
    ) {

        return "İyiyim! 😄 Seninle konuşmaya hazırım.";
    }


    /* ADIN NE */

    if (
        text.includes("adın ne") ||
        text.includes("ismin ne")
    ) {

        return "Benim adım Çınar AI. 🌳🤖";
    }


    /* KİMSİN */

    if (
        text.includes("sen kimsin") ||
        text === "kimsin"
    ) {

        return "Ben Çınar AI! 🌳 Senin için hazırlanmış bir yapay zekâ sohbet asistanıyım.";
    }


    /* SENİ KİM YAPTI */

    if (
        text.includes("seni kim yaptı") ||
        text.includes("seni kim yapti") ||
        text.includes("kim yaptı seni") ||
        text.includes("kim yapti seni")
    ) {

        return "Beni Çınar yaptı. 🌳🤖";
    }


    /* NE YAPABİLİRSİN */

    if (
        text.includes("ne yapabilirsin") ||
        text.includes("neler yapabilirsin") ||
        text.includes("ne yapıyorsun")
    ) {

        return "Sorularını cevaplayabilir, sohbet edebilir, saati söyleyebilir ve sık yapılan bazı yazım hatalarını anlayabilirim. 😊";
    }


    /* TEŞEKKÜR */

    if (
        text.includes("teşekkür") ||
        text.includes("sağ ol")
    ) {

        return "Rica ederim! 😊";
    }


    /* ŞAKA */

    if (
        text.includes("şaka yap") ||
        text.includes("bana şaka yap")
    ) {

        return "Bilgisayar neden doktora gitmiş? Çünkü virüs kapmış! 😂";
    }


    /* NASIL YARDIM */

    if (
        text.includes("yardım eder misin") ||
        text.includes("yardim eder misin")
    ) {

        return "Tabii! 😊 Ne konuda yardım istediğini yaz.";
    }


    /* YAZIM HATASI FARK EDİLDİ */

    const originalNormalized = normalizeText(originalMessage);

    if (originalNormalized !== text) {

        return "Bunu anladım. 😊 Yazım biraz farklı olsa da ne demek istediğini anlayabiliyorum.";
    }


    /* ANLAŞILMAYAN MESAJ */

    return "Bunu tam anlayamadım. 🤔 Biraz farklı şekilde yazmayı deneyebilir misin?";
}


/* -----------------------------
   MESAJ EKLE
----------------------------- */

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.innerHTML = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


/* -----------------------------
   MESAJ GÖNDER
----------------------------- */

function sendMessage() {

    const message = input.value.trim();

    if (message === "") {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    setTimeout(function() {

        const answer = getAnswer(message);

        addMessage(answer, "ai");

    }, 300);
}


/* -----------------------------
   ENTER TUŞU
----------------------------- */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        sendMessage();
    }

});

</script>

</body>
</html>
