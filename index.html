<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çınar AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: #1e293b;
    padding: 18px;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    border-bottom: 1px solid #334155;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 15px;
    line-height: 1.5;
    word-wrap: break-word;
}

.user {
    background: #2563eb;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.ai {
    background: #334155;
    margin-right: auto;
    border-bottom-left-radius: 4px;
}

#inputArea {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #1e293b;
    border-top: 1px solid #334155;
}

#input {
    flex: 1;
    padding: 13px;
    border: none;
    outline: none;
    border-radius: 12px;
    font-size: 16px;
    background: #0f172a;
    color: white;
}

button {
    border: none;
    border-radius: 12px;
    padding: 0 17px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<header>🌳 Çınar AI</header>

<div id="chat">
    <div class="message ai">
        Merhaba! 👋 Ben Çınar AI.<br>
        Bana istediğin şeyi yazabilirsin. 😊
    </div>
</div>

<div id="inputArea">
    <input
        id="input"
        type="text"
        placeholder="Çınar AI'ye bir şey yaz..."
        autocomplete="off"
    >
    <button onclick="sendMessage()">Gönder</button>
</div>

<script>

/* =========================================
   YAZIYI NORMALLEŞTİR
========================================= */

function normalizeText(text) {
    return text
        .toLocaleLowerCase("tr-TR")
        .replace(/[.,!?;:()[\]{}'"`]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================
   SIK YAPILAN YAZIM HATALARI
========================================= */

const corrections = {

    "meraba": "merhaba",
    "merhba": "merhaba",
    "merhbaa": "merhaba",
    "merhbaaa": "merhaba",
    "mrb": "merhaba",

    "slm": "selam",
    "selamm": "selam",
    "selaam": "selam",

    "nasilsin": "nasılsın",
    "nasılsn": "nasılsın",
    "nasılsı": "nasılsın",

    "naber": "ne haber",
    "naberr": "ne haber",
    "nehaber": "ne haber",

    "tesekkur": "teşekkür",
    "tesekkurler": "teşekkürler",
    "tsk": "teşekkür",
    "tşk": "teşekkür",

    "sagol": "sağ ol",
    "saol": "sağ ol",
    "sagolll": "sağ ol",

    "saatkac": "saat kaç",
    "saatkaç": "saat kaç",
    "saat kac": "saat kaç",

    "simdi": "şimdi",
    "suan": "şu an",
    "su an": "şu an",

    "napiyosun": "ne yapıyorsun",
    "napıyosun": "ne yapıyorsun",
    "napiosun": "ne yapıyorsun",

    "adinne": "adın ne",
    "adınne": "adın ne",
    "isminne": "ismin ne",

    "yapabilirmisin": "yapabilir misin",
    "edermisin": "eder misin",
    "yazarmisin": "yazar mısın",
    "soylermisin": "söyler misin",
    "söylermisin": "söyler misin",

    "nedenki": "neden ki",

    "tamammm": "tamam",
    "olurrr": "olur",
    "olmazzz": "olmaz",

    "cok": "çok",
    "cokkk": "çok",

    "cinar": "çınar",
    "çınarr": "çınar"
};


/* =========================================
   FAZLA TEKRARLANAN HARFLERİ AZALT
========================================= */

function reduceRepeatedLetters(word) {
    return word.replace(/(.)\1{2,}/g, "$1$1");
}


/* =========================================
   YAZIM HATALARINI DÜZELT
========================================= */

function fixText(text) {

    let result = normalizeText(text);

    result = result
        .split(" ")
        .map(word => reduceRepeatedLetters(word))
        .join(" ");

    result = correctWords(result);

    return result;
}


function correctWords(text) {

    let words = text.split(" ");

    words = words.map(word => {

        if (corrections[word]) {
            return corrections[word];
        }

        return word;
    });

    return words.join(" ");
}


/* =========================================
   SAAT SORUSU
========================================= */

function isTimeQuestion(text) {

    const patterns = [
        "saat kaç",
        "saat kac",
        "saatkac",
        "saat kaç oldu",
        "saat kac oldu",
        "şu an saat kaç",
        "su an saat kac",
        "şuan saat kaç",
        "suan saat kac",
        "şimdi saat kaç",
        "simdi saat kac"
    ];

    return patterns.some(pattern => text.includes(pattern));
}


/* =========================================
   GÜNCEL SAAT
========================================= */

function getCurrentTime() {

    const now = new Date();

    const hour = String(now.getHours()).padStart(2, "0");
    const minute = String(now.getMinutes()).padStart(2, "0");

    return "🕐 Şu an saat <b>" + hour + ":" + minute + "</b>.";
}


/* =========================================
   TARİH SORUSU
========================================= */

function isDateQuestion(text) {

    const patterns = [

        "bugünün tarihi",
        "bugunun tarihi",
        "bugün tarih ne",
        "bugun tarih ne",
        "bugünün tarihi ne",
        "bugunun tarihi ne",

        "tarih ne",
        "tarih nedir",
        "bugün ayın kaçı",
        "bugun ayin kaci",
        "ayın kaçı",
        "ayin kaci",

        "hangi tarihteyiz",
        "hangi tarihteyiz",
        "bugün hangi tarih",
        "bugun hangi tarih"
    ];

    return patterns.some(pattern => text.includes(pattern));
}


/* =========================================
   GÜNCEL TARİH
   FORMAT: GG.AA.YYYY
========================================= */

function getCurrentDate() {

    const now = new Date();

    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = now.getFullYear();

    return "📅 Bugünün tarihi <b>" +
        day + "." + month + "." + year +
        "</b>.";
}


/* =========================================
   YIL SORUSU
========================================= */

function isYearQuestion(text) {

    const patterns = [
        "hangi yıldayız",
        "hangi yildayiz",
        "hangi yıldayız",
        "hangi yıl",
        "hangi yil",
        "şu an hangi yıl",
        "su an hangi yil",
        "bu yıl kaç",
        "bu yil kac"
    ];

    return patterns.some(pattern => text.includes(pattern));
}


function getCurrentYear() {

    const year = new Date().getFullYear();

    return "📅 Şu an <b>" + year + "</b> yılındayız.";
}


/* =========================================
   ÇINAR AI CEVAP SİSTEMİ
========================================= */

function getAnswer(originalMessage) {

    const original = normalizeText(originalMessage);
    const text = fixText(originalMessage);


    /* SAAT */

    if (isTimeQuestion(text)) {
        return getCurrentTime();
    }


    /* TAM TARİH */

    if (isDateQuestion(text)) {
        return getCurrentDate();
    }


    /* YIL */

    if (isYearQuestion(text)) {
        return getCurrentYear();
    }


    /* MERHABA */

    if (
        text === "merhaba" ||
        text === "selam" ||
        text.includes("merhaba çınar ai") ||
        text.includes("selam çınar ai")
    ) {
        return "Merhaba! 👋 Ben Çınar AI. Nasılsın?";
    }


    /* NASILSIN */

    if (
        text.includes("nasılsın") ||
        text.includes("nasilsin")
    ) {
        return "İyiyim! 😄 Seninle konuşmaya hazırım.";
    }


    /* ADIN NE */

    if (
        text.includes("adın ne") ||
        text.includes("ismin ne")
    ) {
        return "Benim adım Çınar AI. 🌳🤖";
    }


    /* KİMSİN */

    if (
        text.includes("sen kimsin") ||
        text === "kimsin"
    ) {
        return "Ben Çınar AI! 🌳 Senin için hazırlanmış bir yapay zekâ sohbet asistanıyım.";
    }


    /* SENİ KİM YAPTI */

    if (
        text.includes("seni kim yaptı") ||
        text.includes("seni kim yapti") ||
        text.includes("kim yaptı seni") ||
        text.includes("kim yapti seni")
    ) {
        return "Beni Çınar yaptı. 🌳🤖";
    }


    /* NE YAPABİLİRSİN */

    if (
        text.includes("ne yapabilirsin") ||
        text.includes("neler yapabilirsin") ||
        text.includes("ne yapıyorsun")
    ) {
        return "Sorularını cevaplayabilir, sohbet edebilir, saati ve tarihi söyleyebilir ve sık yapılan bazı yazım hatalarını anlayabilirim. 😊";
    }


    /* TEŞEKKÜR */

    if (
        text.includes("teşekkür") ||
        text.includes("sağ ol")
    ) {
        return "Rica ederim! 😊";
    }


    /* ŞAKA */

    if (
        text.includes("şaka yap") ||
        text.includes("bana şaka yap")
    ) {
        return "Bilgisayar neden doktora gitmiş? Çünkü virüs kapmış! 😂";
    }


    /* YARDIM */

    if (
        text.includes("yardım eder misin") ||
        text.includes("yardim eder misin")
    ) {
        return "Tabii! 😊 Ne konuda yardım istediğini yaz.";
    }


    /* YAZIM HATASI ALGILANDI */

    if (original !== text) {
        return "Seni anladım. 😊 Yazım hatası olsa bile ne demek istediğini anlamaya çalışıyorum.";
    }


    /* ANLAŞILMAYAN MESAJ */

    return "Bunu tam anlayamadım. 🤔 Biraz farklı şekilde yazmayı deneyebilir misin?";
}


/* =========================================
   MESAJ EKLE
========================================= */

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.innerHTML = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


/* =========================================
   MESAJ GÖNDER
========================================= */

function sendMessage() {

    const message = input.value.trim();

    if (message === "") {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    setTimeout(function() {

        const answer = getAnswer(message);

        addMessage(answer, "ai");

    }, 300);
}


/* =========================================
   ENTER İLE GÖNDER
========================================= */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
