<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çınar AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: #1e293b;
    padding: 18px;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    border-bottom: 1px solid #334155;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 15px;
    line-height: 1.5;
    word-wrap: break-word;
}

.user {
    background: #2563eb;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.ai {
    background: #334155;
    margin-right: auto;
    border-bottom-left-radius: 4px;
}

#inputArea {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #1e293b;
    border-top: 1px solid #334155;
}

#input {
    flex: 1;
    padding: 13px;
    border: none;
    outline: none;
    border-radius: 12px;
    font-size: 16px;
    background: #0f172a;
    color: white;
}

button {
    border: none;
    border-radius: 12px;
    padding: 0 17px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<header>🌳 Çınar AI</header>

<div id="chat">
    <div class="message ai">
        Merhaba! 👋 Ben Çınar AI.<br>
        Bana istediğin şeyi yazabilirsin. 😊<br>
        Matematik sorularını farklı şekillerde de anlayabilirim. 🧮
    </div>
</div>

<div id="inputArea">
    <input
        id="input"
        type="text"
        placeholder="Çınar AI'ye bir şey yaz..."
        autocomplete="off"
    >
    <button onclick="sendMessage()">Gönder</button>
</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");


/* ================================
   YAZIYI NORMALLEŞTİR
================================ */

function normalizeText(text) {
    return text
        .toLocaleLowerCase("tr-TR")
        .replace(/İ/g, "i")
        .replace(/I/g, "ı")
        .replace(/\s+/g, " ")
        .trim();
}


/* ================================
   SIK YAPILAN YAZIM HATALARI
================================ */

const corrections = {
    "meraba": "merhaba",
    "merhba": "merhaba",
    "merhbaa": "merhaba",
    "mrb": "merhaba",

    "slm": "selam",
    "selamm": "selam",

    "nasilsin": "nasılsın",
    "nasılsn": "nasılsın",
    "nasılsı": "nasılsın",

    "tesekkur": "teşekkür",
    "tesekkurler": "teşekkürler",
    "tsk": "teşekkür",

    "sagol": "sağ ol",
    "saol": "sağ ol",

    "saatkac": "saat kaç",
    "saat kac": "saat kaç",

    "simdi": "şimdi",
    "suan": "şu an",
    "suanda": "şu anda",

    "napiyosun": "ne yapıyorsun",
    "napıyosun": "ne yapıyorsun",
    "napiosun": "ne yapıyorsun",

    "adinne": "adın ne",
    "isminne": "ismin ne",

    "yapabilirmisin": "yapabilir misin",
    "edermisin": "eder misin",

    "cok": "çok",
    "cinar": "çınar",

    "carpi": "çarpı",
    "carp": "çarp",
    "kac": "kaç",
    "bolu": "bölü",
    "bol": "böl",
    "eksi": "eksi",
    "arti": "artı",
    "topla": "topla",
    "cikar": "çıkar"
};


/* ================================
   TEKRARLANAN HARFLERİ AZALT
================================ */

function reduceRepeatedLetters(word) {
    return word.replace(/(.)\1{2,}/g, "$1$1");
}


/* ================================
   YAZIM HATASI DÜZELT
================================ */

function fixText(text) {

    let result = normalizeText(text);

    result = result
        .split(" ")
        .map(word => reduceRepeatedLetters(word))
        .join(" ");

    let words = result.split(" ");

    words = words.map(word => {
        return corrections[word] || word;
    });

    return words.join(" ");
}


/* ================================
   SAAT
================================ */

function isTimeQuestion(text) {

    return (
        text.includes("saat kaç") ||
        text.includes("saat kac") ||
        text.includes("saatkac") ||
        text.includes("şu an saat") ||
        text.includes("su an saat") ||
        text.includes("şimdi saat")
    );
}


function getCurrentTime() {

    const now = new Date();

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");

    return "🕐 Şu an saat <b>" +
        hours + ":" + minutes +
        "</b>.";
}


/* ================================
   TARİH
================================ */

function isDateQuestion(text) {

    return (
        text.includes("bugünün tarihi") ||
        text.includes("bugunun tarihi") ||
        text.includes("bugün tarih") ||
        text.includes("bugun tarih") ||
        text.includes("tarih ne") ||
        text.includes("tarih nedir") ||
        text.includes("hangi tarihteyiz") ||
        text.includes("bugün hangi tarih") ||
        text.includes("bugun hangi tarih") ||
        text.includes("ayın kaçı") ||
        text.includes("ayin kaci") ||
        text.includes("bugün ayın kaçı") ||
        text.includes("bugun ayin kaci")
    );
}


function getCurrentDate() {

    const now = new Date();

    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = now.getFullYear();

    return "📅 Bugünün tarihi <b>" +
        day + "." +
        month + "." +
        year +
        "</b>.";
}


/* ================================
   YIL
================================ */

function isYearQuestion(text) {

    return (
        text.includes("hangi yıldayız") ||
        text.includes("hangi yildayiz") ||
        text.includes("hangi yıl") ||
        text.includes("hangi yil") ||
        text.includes("şu an hangi yıl") ||
        text.includes("su an hangi yil") ||
        text.includes("bu yıl kaç") ||
        text.includes("bu yil kac")
    );
}


function getCurrentYear() {

    return "📅 Şu an <b>" +
        new Date().getFullYear() +
        "</b> yılındayız.";
}


/* =================================================
   MATEMATİK SİSTEMİ
================================================= */


/*
   Matematik kelimelerini sembollere çevirir.
*/

function convertMathWords(text) {

    let result = text;

    result = result.replace(/çarpı/g, " * ");
    result = result.replace(/carpi/g, " * ");
    result = result.replace(/çarp/g, " * ");
    result = result.replace(/carp/g, " * ");

    result = result.replace(/kere/g, " * ");

    result = result.replace(/bölü/g, " / ");
    result = result.replace(/bolu/g, " / ");
    result = result.replace(/\bböl\b/g, " / ");
    result = result.replace(/\bbol\b/g, " / ");

    result = result.replace(/artı/g, " + ");
    result = result.replace(/arti/g, " + ");

    result = result.replace(/eksi/g, " - ");

    result = result.replace(/çıkar/g, " - ");
    result = result.replace(/cikar/g, " - ");

    result = result.replace(/üzeri/g, " ^ ");
    result = result.replace(/uzeri/g, " ^ ");

    return result;
}


/*
   Matematik sorusu olup olmadığını kontrol eder.
*/

function looksLikeMath(text) {

    const hasNumbers = /\d/.test(text);

    if (!hasNumbers) {
        return false;
    }

    const mathWords =
        /çarpı|carpi|çarp|carp|kere|bölü|bolu|\bböl\b|\bbol\b|artı|arti|eksi|çıkar|cikar|toplam|çarpımı|carpimi|farkı|farki|sonucu|hesapla|kaç|kac|\+|\-|\*|\/|×|÷|\^/i;

    return mathWords.test(text);
}


/*
   Metindeki sayıları bulur.
*/

function extractNumbers(text) {

    const matches = text.match(/-?\d+(?:[.,]\d+)?/g);

    if (!matches) {
        return [];
    }

    return matches.map(number => {
        return Number(number.replace(",", "."));
    });
}


/*
   Matematik işlemini bul.
*/

function detectOperation(text) {

    if (
        text.includes("çarpı") ||
        text.includes("carpi") ||
        text.includes("çarp") ||
        text.includes("carp") ||
        text.includes("kere") ||
        text.includes("çarpımı") ||
        text.includes("carpimi") ||
        text.includes("*") ||
        text.includes("×")
    ) {
        return "*";
    }

    if (
        text.includes("bölü") ||
        text.includes("bolu") ||
        text.includes(" böl ") ||
        text.includes(" bol ") ||
        text.includes("/") ||
        text.includes("÷")
    ) {
        return "/";
    }

    if (
        text.includes("artı") ||
        text.includes("arti") ||
        text.includes("toplam") ||
        text.includes("+")
    ) {
        return "+";
    }

    if (
        text.includes("eksi") ||
        text.includes("çıkar") ||
        text.includes("cikar") ||
        text.includes("farkı") ||
        text.includes("farki") ||
        text.includes("-")
    ) {
        return "-";
    }

    if (text.includes("^") || text.includes("üzeri")) {
        return "^";
    }

    return null;
}


/*
   Matematik işlemini hesaplar.
*/

function calculateMathQuestion(text) {

    const numbers = extractNumbers(text);
    const operation = detectOperation(text);

    if (numbers.length < 2 || !operation) {
        return null;
    }

    let result;

    switch (operation) {

        case "+":
            result = numbers.reduce((a, b) => a + b, 0);
            break;

        case "-":
            result = numbers.slice(1).reduce(
                (a, b) => a - b,
                numbers[0]
            );
            break;

        case "*":
            result = numbers.reduce((a, b) => a * b, 1);
            break;

        case "/":

            if (numbers.slice(1).some(n => n === 0)) {
                return "❌ Sıfıra bölme yapılamaz.";
            }

            result = numbers.slice(1).reduce(
                (a, b) => a / b,
                numbers[0]
            );

            break;

        case "^":
            result = Math.pow(numbers[0], numbers[1]);
            break;

        default:
            return null;
    }

    if (!Number.isFinite(result)) {
        return "❌ Bu işlemin sonucu hesaplanamadı.";
    }

    let formatted;

    if (Number.isInteger(result)) {
        formatted = result.toLocaleString("tr-TR");
    } else {
        formatted = Number(result.toFixed(10))
            .toLocaleString("tr-TR");
    }

    return "🧮 <b>Sonuç: " + formatted + "</b>";
}


/* ================================
   ÇINAR AI CEVAP MOTORU
================================ */

function getAnswer(message) {

    const original = normalizeText(message);
    const text = fixText(message);


    /* MATEMATİK */

    if (looksLikeMath(text)) {

        const mathAnswer = calculateMathQuestion(text);

        if (mathAnswer !== null) {
            return mathAnswer;
        }
    }


    /* TARİH */

    if (isDateQuestion(text)) {
        return getCurrentDate();
    }


    /* YIL */

    if (isYearQuestion(text)) {
        return getCurrentYear();
    }


    /* SAAT */

    if (isTimeQuestion(text)) {
        return getCurrentTime();
    }


    /* MERHABA */

    if (
        text === "merhaba" ||
        text === "selam" ||
        text.includes("merhaba çınar ai") ||
        text.includes("selam çınar ai")
    ) {
        return "Merhaba! 👋 Ben Çınar AI. Nasılsın?";
    }


    /* NASILSIN */

    if (
        text.includes("nasılsın") ||
        text.includes("nasilsin")
    ) {
        return "İyiyim! 😄 Seninle konuşmaya hazırım.";
    }


    /* ADIN NE */

    if (
        text.includes("adın ne") ||
        text.includes("ismin ne")
    ) {
        return "Benim adım Çınar AI. 🌳🤖";
    }


    /* KİMSİN */

    if (
        text.includes("sen kimsin") ||
        text === "kimsin"
    ) {
        return "Ben Çınar AI! 🌳🤖 Senin için hazırlanmış bir yapay zekâ sohbet asistanıyım.";
    }


    /* SENİ KİM YAPTI */

    if (
        text.includes("seni kim yaptı") ||
        text.includes("seni kim yapti") ||
        text.includes("kim yaptı seni") ||
        text.includes("kim yapti seni")
    ) {
        return "Beni Çınar yaptı. 🌳🤖";
    }


    /* NE YAPABİLİRSİN */

    if (
        text.includes("ne yapabilirsin") ||
        text.includes("neler yapabilirsin")
    ) {
        return "Sorularını cevaplayabilir, farklı şekillerde yazılmış matematik işlemlerini çözebilir, sohbet edebilir, saati ve tarihi söyleyebilirim. 😊";
    }


    /* TEŞEKKÜR */

    if (
        text.includes("teşekkür") ||
        text.includes("sağ ol")
    ) {
        return "Rica ederim! 😊";
    }


    /* ŞAKA */

    if (
        text.includes("şaka yap") ||
        text.includes("bana şaka yap")
    ) {
        return "Bilgisayar neden doktora gitmiş? Çünkü virüs kapmış! 😂";
    }


    /* YARDIM */

    if (
        text.includes("yardım eder misin") ||
        text.includes("yardim eder misin")
    ) {
        return "Tabii! 😊 Ne konuda yardım istediğini yaz.";
    }


    /* YAZIM HATASI */

    if (original !== text) {
        return "Seni anladım. 😊 Yazım hatası olsa bile ne demek istediğini anlayabiliyorum.";
    }


    /* ANLAŞILMAYAN MESAJ */

    return "Bunu tam anlayamadım. 🤔 Biraz farklı şekilde yazmayı deneyebilir misin?";
}


/* ================================
   MESAJI EKRANA EKLE
================================ */

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;
    div.innerHTML = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


/* ================================
   MESAJ GÖNDER
================================ */

function sendMessage() {

    const message = input.value.trim();

    if (message === "") {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    setTimeout(function() {

        const answer = getAnswer(message);

        addMessage(answer, "ai");

    }, 300);
}


/* ================================
   ENTER
================================ */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
