<!DOCTYPE html><html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Çınar AI</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101820, #1b2735);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(0, 0, 0, 0.3);
      padding: 18px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
    }

    .ai {
      background: #2d8cff;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .user {
      background: #444;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    #inputArea {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: rgba(0, 0, 0, 0.3);
    }

    #messageInput {
      flex: 1;
      border: none;
      border-radius: 25px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 25px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #2d8cff;
      color: white;
    }

    button:hover {
      background: #1675db;
    }
  </style></head><body>  <header>🌳 Çınar AI</header>  <div id="chat">
    <div class="message ai">
      👋 Merhaba! Ben Çınar AI. Sana nasıl yardımcı olabilirim?
    </div>
  </div>  <div id="inputArea">
    <input
      type="text"
      id="messageInput"
      placeholder="Bir şey yaz..."
    >
    <button onclick="sendMessage()">Gönder</button>
  </div>  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (message === "") return;

      // Kullanıcının mesajını ekle
      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;
      chat.appendChild(userMessage);

      input.value = "";

      // Mesajı küçük harfe çevir
      const m = message.toLowerCase();

      let cevap;

      // SELAMLAŞMA
      if (
        m === "merhaba" ||
        m === "selam" ||
        m === "sa" ||
        m.includes("merhaba!") ||
        m.includes("selam!")
      ) {
        cevap = "👋 Merhaba! Nasılsın? Sana nasıl yardımcı olabilirim?";
      }

      // NASILSIN
      else if (
        m.includes("nasılsın") ||
        m.includes("nasilsin") ||
        m.includes("iyi misin")
      ) {
        cevap = "😊 İyiyim, teşekkür ederim! Sen nasılsın?";
      }

      // TEŞEKKÜR
      else if (
        m.includes("teşekkür") ||
        m.includes("tesekkur") ||
        m.includes("sağ ol") ||
        m.includes("sag ol")
      ) {
        cevap = "😊 Rica ederim! Her zaman yardımcı olmaya çalışırım.";
      }

      // GÜLE GÜLE
      else if (
        m.includes("güle güle") ||
        m.includes("gule gule") ||
        m.includes("hoşça kal") ||
        m.includes("hosca kal") ||
        m === "bye"
      ) {
        cevap = "👋 Görüşürüz! Kendine iyi bak!";
      }

      // KİMSİN
      else if (
        m.includes("sen kimsin") ||
        m.includes("kimsin")
      ) {
        cevap = "🤖 Ben Çınar AI. Sorularını cevaplamak ve seninle sohbet etmek için buradayım.";
      }

      // NE YAPIYORSUN
      else if (
        m.includes("ne yapıyorsun") ||
        m.includes("ne yapiyorsun")
      ) {
        cevap = "😄 Şu anda seninle sohbet ediyorum!";
      }

      // GENEL CEVAPLAR
      else {
        const cevaplar = [
          "🤔 İlginç! Biraz daha anlatır mısın?",
          "😊 Anladım. Bunu biraz daha açıklayabilir misin?",
          "💡 Bunu birlikte çözmeye çalışabiliriz.",
          "👍 Anladım!",
          "🤖 Bunun hakkında düşünmem gerekiyor.",
          "😊 Tabii! Sana yardımcı olmaya çalışacağım."
        ];

        cevap =
          cevaplar[Math.floor(Math.random() * cevaplar.length)];
      }

      // AI cevabını göster
      setTimeout(() => {
        const aiMessage = document.createElement("div");
        aiMessage.className = "message ai";
        aiMessage.textContent = cevap;

        chat.appendChild(aiMessage);
        chat.scrollTop = chat.scrollHeight;
      }, 500);

      chat.scrollTop = chat.scrollHeight;
    }

    // Enter tuşuyla gönderme
    document
      .getElementById("messageInput")
      .addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
  </script></body>
</html>
