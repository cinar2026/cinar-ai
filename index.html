<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çınar AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: #1e293b;
    padding: 18px;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    border-bottom: 1px solid #334155;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.message {
    max-width: 85%;
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 15px;
    line-height: 1.5;
    word-wrap: break-word;
}

.user {
    background: #2563eb;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.ai {
    background: #334155;
    margin-right: auto;
    border-bottom-left-radius: 4px;
}

#inputArea {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #1e293b;
    border-top: 1px solid #334155;
}

#input {
    flex: 1;
    padding: 13px;
    border: none;
    outline: none;
    border-radius: 12px;
    font-size: 16px;
    background: #0f172a;
    color: white;
}

button {
    border: none;
    border-radius: 12px;
    padding: 0 17px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<header>🌳 Çınar AI</header>

<div id="chat">
    <div class="message ai">
        Merhaba! 👋 Ben Çınar AI.<br>
        Bana istediğin şeyi yazabilirsin. 😊<br>
        Matematik işlemlerini de çözebilirim! 🧮
    </div>
</div>

<div id="inputArea">
    <input
        id="input"
        type="text"
        placeholder="Çınar AI'ye bir şey yaz..."
        autocomplete="off"
    >
    <button onclick="sendMessage()">Gönder</button>
</div>

<script>

/* ================================
   YAZIYI NORMALLEŞTİR
================================ */

function normalizeText(text) {
    return text
        .toLocaleLowerCase("tr-TR")
        .replace(/[.,!?;:()[\]{}'"`]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* ================================
   SIK YAPILAN HATALAR
================================ */

const corrections = {
    "meraba": "merhaba",
    "merhba": "merhaba",
    "merhbaa": "merhaba",
    "mrb": "merhaba",

    "slm": "selam",
    "selamm": "selam",

    "nasilsin": "nasılsın",
    "nasılsn": "nasılsın",
    "nasılsı": "nasılsın",

    "naber": "ne haber",
    "naberr": "ne haber",
    "nehaber": "ne haber",

    "tesekkur": "teşekkür",
    "tesekkurler": "teşekkürler",
    "tsk": "teşekkür",
    "tşk": "teşekkür",

    "sagol": "sağ ol",
    "saol": "sağ ol",

    "saatkac": "saat kaç",
    "saatkaç": "saat kaç",
    "saat kac": "saat kaç",

    "simdi": "şimdi",
    "suan": "şu an",
    "suanda": "şu anda",

    "napiyosun": "ne yapıyorsun",
    "napıyosun": "ne yapıyorsun",
    "napiosun": "ne yapıyorsun",

    "adinne": "adın ne",
    "isminne": "ismin ne",

    "yapabilirmisin": "yapabilir misin",
    "edermisin": "eder misin",

    "cok": "çok",
    "cinar": "çınar"
};


/* ================================
   FAZLA HARFLERİ AZALT
================================ */

function reduceRepeatedLetters(word) {
    return word.replace(/(.)\1{2,}/g, "$1$1");
}


/* ================================
   YAZIM HATASI DÜZELT
================================ */

function fixText(text) {

    let result = normalizeText(text);

    result = result
        .split(" ")
        .map(word => reduceRepeatedLetters(word))
        .join(" ");

    let words = result.split(" ");

    words = words.map(word => {
        return corrections[word] || word;
    });

    return words.join(" ");
}


/* ================================
   SAAT SORUSU
================================ */

function isTimeQuestion(text) {

    const words = [
        "saat kaç",
        "saat kac",
        "saatkac",
        "saat kaç oldu",
        "saat kac oldu",
        "şu an saat kaç",
        "su an saat kac",
        "şuan saat kaç",
        "suan saat kac",
        "şimdi saat kaç",
        "simdi saat kac",
        "şu an saat kaç oldu",
        "su an saat kac oldu"
    ];

    return words.some(x => text.includes(x));
}


/* ================================
   SAATİ SÖYLE
================================ */

function getCurrentTime() {

    const now = new Date();

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");

    return "🕐 Şu an saat <b>" +
        hours + ":" + minutes +
        "</b>.";
}


/* ================================
   TARİH SORUSU
================================ */

function isDateQuestion(text) {

    if (text.includes("bugünün tarihi")) return true;
    if (text.includes("bugunun tarihi")) return true;
    if (text.includes("bugün tarih")) return true;
    if (text.includes("bugun tarih")) return true;

    if (text.includes("tarih ne")) return true;
    if (text.includes("tarih nedir")) return true;

    if (text.includes("hangi tarihteyiz")) return true;

    if (text.includes("bugün ayın kaçı")) return true;
    if (text.includes("bugun ayin kaci")) return true;

    if (text.includes("ayın kaçı")) return true;
    if (text.includes("ayin kaci")) return true;

    if (text.includes("bugün hangi tarih")) return true;
    if (text.includes("bugun hangi tarih")) return true;

    return false;
}


/* ================================
   TAM TARİHİ SÖYLE
================================ */

function getCurrentDate() {

    const now = new Date();

    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = now.getFullYear();

    return "📅 Bugünün tarihi <b>" +
        day + "." +
        month + "." +
        year +
        "</b>.";
}


/* ================================
   YIL SORUSU
================================ */

function isYearQuestion(text) {

    if (text.includes("hangi yıldayız")) return true;
    if (text.includes("hangi yildayiz")) return true;
    if (text.includes("hangi yıl")) return true;
    if (text.includes("hangi yil")) return true;
    if (text.includes("şu an hangi yıl")) return true;
    if (text.includes("su an hangi yil")) return true;
    if (text.includes("bu yıl kaç")) return true;
    if (text.includes("bu yil kac")) return true;

    return false;
}


/* ================================
   YILI SÖYLE
================================ */

function getCurrentYear() {

    const year = new Date().getFullYear();

    return "📅 Şu an <b>" +
        year +
        "</b> yılındayız.";
}


/* ================================
   MATEMATİK İŞLEMİ Mİ?
================================ */

function isMathQuestion(text) {

    const mathWords = [
        "kaç",
        "kac",
        "hesapla",
        "işlemin sonucu",
        "islemin sonucu",
        "sonuç",
        "sonuc",
        "topla",
        "toplam",
        "çarp",
        "carp",
        "çarpı",
        "carpi",
        "kere",
        "böl",
        "bol",
        "bölü",
        "bolu",
        "çıkar",
        "cikar",
        "eksi"
    ];

    const hasNumber = /\d/.test(text);
    const hasOperator =
        /[+\-*/×÷^=]/.test(text) ||
        mathWords.some(word => text.includes(word));

    return hasNumber && hasOperator;
}


/* ================================
   MATEMATİK METNİNİ TEMİZLE
================================ */

function prepareMath(text) {

    let expression = text
        .toLocaleLowerCase("tr-TR")
        .replace(/,/g, ".")
        .replace(/×/g, "*")
        .replace(/÷/g, "/")
        .replace(/çarpı/g, "*")
        .replace(/carpi/g, "*")
        .replace(/kere/g, "*")
        .replace(/çarp/g, "*")
        .replace(/carp/g, "*")
        .replace(/bölü/g, "/")
        .replace(/bolu/g, "/")
        .replace(/böl/g, "/")
        .replace(/bol/g, "/")
        .replace(/artı/g, "+")
        .replace(/arti/g, "+")
        .replace(/topla/g, "+")
        .replace(/eksi/g, "-")
        .replace(/çıkar/g, "-")
        .replace(/cikar/g, "-")
        .replace(/üzeri/g, "^")
        .replace(/uzeri/g, "^")
        .replace(/kuvveti/g, "^");

    /*
       Soru cümlesindeki matematik dışı kelimeleri
       kaldırıyoruz.
    */

    expression = expression
        .replace(/kaçtır/g, "")
        .replace(/kactir/g, "")
        .replace(/kaç/g, "")
        .replace(/kac/g, "")
        .replace(/nedir/g, "")
        .replace(/sonucu/g, "")
        .replace(/sonuç/g, "")
        .replace(/sonuc/g, "")
        .replace(/hesapla/g, "")
        .replace(/işlemin/g, "")
        .replace(/islemin/g, "")
        .replace(/işlemi/g, "")
        .replace(/islemi/g, "")
        .replace(/=?/g, "");

    /*
       Sadece güvenli matematik karakterlerini bırak.
    */

    expression = expression.replace(/[^0-9+\-*/().^%\s]/g, "");

    return expression.trim();
}


/* ================================
   MATEMATİK ÇÖZ
================================ */

function calculateMath(text) {

    let expression = prepareMath(text);

    if (!expression) {
        return null;
    }

    /*
       Çok uzun veya şüpheli ifadeleri çalıştırma.
    */

    if (expression.length > 100) {
        return null;
    }

    /*
       Sadece matematik karakterleri olduğundan emin ol.
    */

    if (!/^[0-9+\-*/().^%\s]+$/.test(expression)) {
        return null;
    }

    /*
       Bölme işlemlerinde sıfıra bölmeyi kontrol et.
    */

    if (/\/\s*0(\D|$)/.test(expression)) {
        return "❌ Sıfıra bölme yapılamaz.";
    }

    try {

        /*
           JavaScript'te ^ XOR olduğu için
           matematikte üs anlamına gelecek şekilde
           ** operatörüne dönüştürüyoruz.
        */

        expression = expression.replace(/\^/g, "**");

        /*
           Matematik ifadesini hesapla.
        */

        const result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(result)) {
            return "❌ Bu işlemin sonucu hesaplanamadı.";
        }

        let formattedResult;

        if (Number.isInteger(result)) {
            formattedResult = result.toLocaleString("tr-TR");
        } else {
            formattedResult = Number(result.toFixed(10))
                .toLocaleString("tr-TR");
        }

        return "🧮 Sonuç: <b>" + formattedResult + "</b>";

    } catch (error) {

        return null;
    }
}


/* ================================
   ÇINAR AI CEVAP MOTORU
================================ */

function getAnswer(message) {

    const original = normalizeText(message);
    const text = fixText(message);


    /* MATEMATİK */

    if (isMathQuestion(text)) {

        const mathAnswer = calculateMath(text);

        if (mathAnswer !== null) {
            return mathAnswer;
        }
    }


    /* TARİH */

    if (isDateQuestion(text)) {
        return getCurrentDate();
    }


    /* YIL */

    if (isYearQuestion(text)) {
        return getCurrentYear();
    }


    /* SAAT */

    if (isTimeQuestion(text)) {
        return getCurrentTime();
    }


    /* MERHABA */

    if (
        text === "merhaba" ||
        text === "selam" ||
        text.includes("merhaba çınar ai") ||
        text.includes("selam çınar ai")
    ) {
        return "Merhaba! 👋 Ben Çınar AI. Nasılsın?";
    }


    /* NASILSIN */

    if (
        text.includes("nasılsın") ||
        text.includes("nasilsin")
    ) {
        return "İyiyim! 😄 Seninle konuşmaya hazırım.";
    }


    /* ADIN NE */

    if (
        text.includes("adın ne") ||
        text.includes("ismin ne")
    ) {
        return "Benim adım Çınar AI. 🌳🤖";
    }


    /* KİMSİN */

    if (
        text.includes("sen kimsin") ||
        text === "kimsin"
    ) {
        return "Ben Çınar AI! 🌳🤖 Senin için hazırlanmış bir yapay zekâ sohbet asistanıyım.";
    }


    /* SENİ KİM YAPTI */

    if (
        text.includes("seni kim yaptı") ||
        text.includes("seni kim yapti") ||
        text.includes("kim yaptı seni") ||
        text.includes("kim yapti seni")
    ) {
        return "Beni Çınar yaptı. 🌳🤖";
    }


    /* NE YAPABİLİRSİN */

    if (
        text.includes("ne yapabilirsin") ||
        text.includes("neler yapabilirsin")
    ) {
        return "Sorularını cevaplayabilir, sohbet edebilir, matematik işlemlerini çözebilir, saati ve bugünün tarihini söyleyebilir ve sık yapılan yazım hatalarını anlayabilirim. 😊";
    }


    /* TEŞEKKÜR */

    if (
        text.includes("teşekkür") ||
        text.includes("sağ ol")
    ) {
        return "Rica ederim! 😊";
    }


    /* ŞAKA */

    if (
        text.includes("şaka yap") ||
        text.includes("bana şaka yap")
    ) {
        return "Bilgisayar neden doktora gitmiş? Çünkü virüs kapmış! 😂";
    }


    /* YARDIM */

    if (
        text.includes("yardım eder misin") ||
        text.includes("yardim eder misin")
    ) {
        return "Tabii! 😊 Ne konuda yardım istediğini yaz.";
    }


    /* YAZIM HATASI ALGILANDI */

    if (original !== text) {
        return "Seni anladım. 😊 Yazım hatası olsa bile ne demek istediğini anlayabiliyorum.";
    }


    /* ANLAŞILMAYAN MESAJ */

    return "Bunu tam anlayamadım. 🤔 Biraz farklı şekilde yazmayı deneyebilir misin?";
}


/* ================================
   MESAJI EKRANA EKLE
================================ */

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.innerHTML = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


/* ================================
   MESAJ GÖNDER
================================ */

function sendMessage() {

    const message = input.value.trim();

    if (message === "") {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    setTimeout(function() {

        const answer = getAnswer(message);

        addMessage(answer, "ai");

    }, 300);
}


/* ================================
   ENTER TUŞU
================================ */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
