<!DOCTYPE html><html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Çınar AI</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101820, #1b2735);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(0, 0, 0, 0.3);
      padding: 18px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .ai {
      background: #2d8cff;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .user {
      background: #444;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    #inputArea {
      display: flex;
      padding: 15px;
      gap: 10px;
      background: rgba(0, 0, 0, 0.3);
    }

    #messageInput {
      flex: 1;
      border: none;
      border-radius: 25px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 25px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #2d8cff;
      color: white;
    }

    button:hover {
      background: #1675db;
    }
  </style></head><body>  <header>🌳 Çınar AI</header>  <div id="chat">
    <div class="message ai">
      👋 Merhaba! Ben Çınar AI. Sana nasıl yardımcı olabilirim?
    </div>
  </div>  <div id="inputArea">
    <input
      type="text"
      id="messageInput"
      placeholder="Bir şey yaz..."
    ><button onclick="sendMessage()">Gönder</button>

  </div>  <script>

    // ==================================================
    // GEÇİCİ İSİM HAFIZASI
    // Sayfa kapanınca isim tamamen unutulur.
    // ==================================================

    let kullaniciAdi = null;


    // ==================================================
    // TARİH VE SAAT
    // ==================================================

    function saat() {

      const simdi = new Date();

      return simdi.toLocaleTimeString("tr-TR", {
        hour: "2-digit",
        minute: "2-digit"
      });

    }


    function tarih() {

      const simdi = new Date();

      return simdi.toLocaleDateString("tr-TR", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });

    }


    function yil() {

      return new Date().getFullYear();

    }


    // ==================================================
    // İSİM BULMA
    // ==================================================

    function adBul(mesaj) {

      const desenler = [
        /^benim adım (.+)$/i,
        /^benim adim (.+)$/i,
        /^adım (.+)$/i,
        /^adim (.+)$/i
      ];

      for (const desen of desenler) {

        const sonuc = mesaj.match(desen);

        if (sonuc) {

          let ad = sonuc[1].trim();

          ad = ad.replace(/[.!?]+$/, "").trim();

          if (ad.length > 0 && ad.length <= 30) {
            return ad;
          }

        }

      }

      return null;

    }


    // ==================================================
    // MESAJ GÖNDER
    // ==================================================

    function sendMessage() {

      const input =
        document.getElementById("messageInput");

      const chat =
        document.getElementById("chat");

      const mesaj =
        input.value.trim();

      if (mesaj === "") return;


      // Kullanıcı mesajı
      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user";

      userMessage.textContent =
        mesaj;

      chat.appendChild(userMessage);

      input.value = "";


      // Karşılaştırma için küçük harfe çeviriyoruz
      const m =
        mesaj.toLocaleLowerCase("tr-TR").trim();


      let cevap = null;


      // ==================================================
      // 1. KULLANICI ADINI SÖYLÜYOR
      // ==================================================

      const yeniAd = adBul(mesaj);

      if (yeniAd) {

        kullaniciAdi = yeniAd;

        cevap =
          "😊 Memnun oldum, " +
          kullaniciAdi +
          "!";

      }


      // ==================================================
      // 2. MERHABA
      // ==================================================

      else if (
        [
          "merhaba",
          "selam",
          "hey",
          "sa",
          "selam!",
          "merhaba!",
          "hey!"
        ].includes(m)
      ) {

        if (kullaniciAdi) {

          cevap =
            "👋 Merhaba " +
            kullaniciAdi +
            "!";

        } else {

          cevap =
            "👋 Merhaba!";

        }

      }


      // ==================================================
      // 3. NASILSIN
      // ==================================================

      else if (
        [
          "nasılsın",
          "nasilsin",
          "iyi misin",
          "nasılsın?",
          "nasilsin?"
        ].includes(m)
      ) {

        if (kullaniciAdi) {

          cevap =
            "😊 İyiyim, teşekkür ederim " +
            kullaniciAdi +
            "!";

        } else {

          cevap =
            "😊 İyiyim, teşekkür ederim!";

        }

      }


      // ==================================================
      // 4. SAAT
      // ==================================================

      else if (
        [
          "saat kaç",
          "saat kac",
          "şu an saat kaç",
          "su an saat kac",
          "şimdi saat kaç",
          "simdi saat kac",
          "saat kaç?"
        ].includes(m)
      ) {

        cevap =
          "🕐 Şu an saat " +
          saat() +
          ".";

      }


      // ==================================================
      // 5. TARİH
      // ==================================================

      else if (
        [
          "bugün tarih ne",
          "bugun tarih ne",
          "bugünün tarihi ne",
          "bugunun tarihi ne",
          "bugün hangi tarih",
          "bugun hangi tarih",
          "tarih ne",
          "bugün tarih ne?"
        ].includes(m)
      ) {

        cevap =
          "📅 Bugünün tarihi " +
          tarih() +
          ".";

      }


      // ==================================================
      // 6. YIL
      // ==================================================

      else if (
        [
          "hangi yıldayız",
          "hangi yildayiz",
          "şu an hangi yıldayız",
          "su an hangi yildayiz",
          "hangi yıl",
          "hangi yil",
          "yıl kaç",
          "yil kac"
        ].includes(m)
      ) {

        cevap =
          "📆 Şu anda " +
          yil() +
          " yılındayız.";

      }


      // ==================================================
      // 7. BENİM ADIM NE?
      // ==================================================

      else if (
        [
          "benim adım ne",
          "benim adim ne",
          "adım ne",
          "adim ne",
          "benim adım ne?",
          "adım ne?"
        ].includes(m)
      ) {

        if (kullaniciAdi) {

          cevap =
            "👤 Adın " +
            kullaniciAdi +
            ".";

        } else {

          cevap =
            "🤔 Bana adını henüz söylemedin.";

        }

      }


      // ==================================================
      // 8. SEN KİMSİN?
      // ==================================================

      else if (
        [
          "kimsin",
          "sen kimsin",
          "sen kimsin?",
          "adın ne",
          "adin ne"
        ].includes(m)
      ) {

        cevap =
          "🤖 Ben Çınar AI! Seninle sohbet etmek için buradayım.";

      }


      // ==================================================
      // 9. TEŞEKKÜR
      // ==================================================

      else if (
        [
          "teşekkürler",
          "tesekkurler",
          "teşekkür ederim",
          "tesekkur ederim",
          "sağ ol",
          "sag ol"
        ].includes(m)
      ) {

        cevap =
          "😊 Rica ederim!";

      }


      // ==================================================
      // 10. GÜLE GÜLE
      // ==================================================

      else if (
        [
          "güle güle",
          "gule gule",
          "hoşça kal",
          "hosca kal",
          "bye"
        ].includes(m)
      ) {

        cevap =
          "👋 Görüşürüz! Kendine iyi bak!";

      }


      // ==================================================
      // 11. SEÇİLMEMİŞ SORULAR
      // ==================================================

      if (cevap === null) {

        const genelCevaplar = [

          "🤔 Bunu biraz daha açıklar mısın?",

          "😊 İlginç! Biraz daha anlatır mısın?",

          "💡 Bunu daha ayrıntılı anlatabilir misin?",

          "🤖 Bu konuda henüz öğreneceklerim var.",

          "👍 Anladım! Devam edebilirsin.",

          "🤔 Hmm... Bunun hakkında biraz daha konuşalım.",

          "😊 Anladım. Başka bir şey sormak ister misin?"

        ];


        cevap =
          genelCevaplar[
            Math.floor(
              Math.random() * genelCevaplar.length
            )
          ];

      }


      // ==================================================
      // AI CEVABI
      // ==================================================

      setTimeout(() => {

        const aiMessage =
          document.createElement("div");

        aiMessage.className =
          "message ai";

        aiMessage.textContent =
          cevap;

        chat.appendChild(aiMessage);

        chat.scrollTop =
          chat.scrollHeight;

      }, 500);


      chat.scrollTop =
        chat.scrollHeight;

    }


    // ==================================================
    // ENTER İLE GÖNDER
    // ==================================================

    document
      .getElementById("messageInput")
      .addEventListener(
        "keypress",
        function(event) {

          if (event.key === "Enter") {
            sendMessage();
          }

        }
      );

  </script></body>
</html>
